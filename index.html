<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-black via-blue-800 to-black font-sans text-white">
  <!-- Navbar Placeholder -->
  <nav class="bg-gray-900 text-white p-4 text-center">Navbar</nav>

  <main class="min-h-screen py-10 px-6 sm:px-12">
    <header class="mb-16">
      <h1 class="text-5xl font-extrabold mb-2 text-left">Hello, ROOMMATE 1</h1>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
      <!-- Schedule -->
      <section class="lg:col-span-2 bg-white rounded-xl shadow-lg p-6 text-gray-800">
        <h2 class="text-xl font-semibold text-white bg-gradient-to-r from-blue-500 via-blue-700 to-blue-500 py-2 px-4 rounded-full text-center mb-4">
          <a href="/Schedule" class="hover:underline">Weekly Schedule</a>
        </h2>
        <ul class="space-y-3">
          <li class="border-l-4 border-blue-400 bg-blue-50 px-4 py-2"><strong>TUE - Afternoon</strong>: ROOMMATE 1 - Cooking 2-3</li>
          <li class="border-l-4 border-blue-400 bg-blue-50 px-4 py-2"><strong>WED - Evening</strong>: ROOMMATE 2 - Cleaning 5-6</li>
          <li class="border-l-4 border-blue-400 bg-blue-50 px-4 py-2"><strong>FRI - Night</strong>: ROOMMATE 1 - Studying 8-10</li>
        </ul>
      </section>

      <!-- Door Lock -->
      <section class="bg-white text-center text-gray-800 rounded-xl shadow-lg p-8 flex flex-col justify-center items-center">
        <h2 class="text-xl font-semibold text-white bg-gradient-to-r from-blue-500 via-blue-700 to-blue-500 py-2 px-4 rounded-full mb-4">Door Lock</h2>
        <div class="w-20 h-20 mb-6 rounded-full bg-red-500"></div>
        <button class="px-6 py-2 text-white font-semibold rounded bg-gray-800">Locked</button>
      </section>
    </div>

    <!-- Visitors & Reminders -->
    <div class="mt-12 grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Visitors -->
      <section class="bg-white text-gray-800 rounded-xl shadow-md p-6">
        <div class="text-center bg-gradient-to-r from-blue-500 via-blue-700 to-blue-500 text-white font-bold py-2 px-4 rounded-full mb-4">Visitors</div>
        <ul class="divide-y">
          <li class="py-3 flex items-center gap-4">
            <img src="images/visitorplaceholder.png" alt="Visitor" class="w-12 h-12 rounded-full" />
            <div>
              <p class="font-medium">Belly Conklin</p>
