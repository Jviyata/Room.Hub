<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reminders</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-r from-black via-blue-800 to-black py-10 px-6 font-sans text-white">

  <!-- Navbar -->
  <nav class="bg-black text-white p-4 shadow-lg fixed top-0 left-0 right-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
      <a href="index.html" class="text-3xl font-extrabold text-blue-500">RoomHub</a>
      <div class="space-x-6">
        <a href="index.html" class="text-lg hover:text-blue-400 transition-colors">Dashboard</a>
        <a href="Guests.html" class="text-lg hover:text-blue-400 transition-colors">Guests</a>
        <a href="reminders.html" class="text-lg hover:text-blue-400 transition-colors">Reminders</a>
        <a href="schedule.html" class="text-lg hover:text-blue-400 transition-colors">Schedule</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="pt-24 max-w-3xl mx-auto space-y-10">

    <h1 class="text-4xl font-extrabold text-center mb-8">Reminders</h1>

    <!-- Reminder Form -->
    <div class="bg-white text-gray-900 p-6 rounded-xl shadow-lg">
      <h2 class="text-xl font-semibold text-blue-700 mb-4">Create a New Reminder</h2>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Task</label>
        <select class="w-full px-4 py-2 border border-gray-300 rounded-md">
          <option>Take out trash</option>
          <option>Clean kitchen</option>
          <option>Vacuum living room</option>
          <option>Wash dishes</option>
          <option>Laundry</option>
          <option>Pay utility bills</option>
          <option>Water plants</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Assign To</label>
        <select class="w-full px-4 py-2 border border-gray-300 rounded-md">
          <option>ROOMMATE 1</option>
          <option>ROOMMATE 2</option>
        </select>
      </div>

      <button class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 px-4 rounded-md">
        Add Reminder
      </button>
    </div>

    <!-- Tasks Lists -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

      <!-- Upcoming Tasks -->
      <section class="bg-white text-gray-900 p-6 rounded-xl shadow-lg">
        <h2 class="text-xl font-semibold text-blue-700 mb-4">Upcoming Tasks</h2>
        <ul class="space-y-4 h-64 overflow-y-auto">
          <li class="p-4 border border-blue-200 rounded-lg">
            <p class="mb-3">Clean kitchen</p>
            <div class="flex gap-2">
              <button class="flex-1 py-1 text-sm font-medium rounded bg-green-600 text-white">Mark Complete</button>
              <button class="flex-1 py-1 text-sm font-medium rounded bg-red-600 text-white">Delete</button>
            </div>
          </li>
          <li class="p-4 border border-blue-200 rounded-lg">
            <p class="mb-3">Vacuum living room</p>
            <div class="flex gap-2">
              <button class="flex-1 py-1 text-sm font-medium rounded bg-green-600 text-white">Mark Complete</button>
              <button class="flex-1 py-1 text-sm font-medium rounded bg-red-600 text-white">Delete</button>
            </div>
          </li>
        </ul>
      </section>

      <!-- Completed Tasks -->
      <section class="bg-white text-gray-900 p-6 rounded-xl shadow-lg">
        <h2 class="text-xl font-semibold text-blue-700 mb-4">Completed Tasks</h2>
        <ul class="space-y-4 h-64 overflow-y-auto">
          <li class="p-4 border border-blue-200 rounded-lg">
            <p class="mb-3 line-through">Take out trash</p>
            <p class="text-sm text-gray-500">Completed by: ROOMMATE 2</p>
          </li>
          <li class="p-4 border border-blue-200 rounded-lg">
            <p class="mb-3 line-through">Wash dishes</p>
            <p class="text-sm text-gray-500">Completed by: ROOMMATE 2</p>
          </li>
        </ul>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-12 text-center text-gray-400">
    <p>&copy; 2025 RoomHub. All rights reserved.</p>
  </footer>

</body>
</html>
